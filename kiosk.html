<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YMS Live — DC 6056</title><style>* { box-sizing: border-box; margin: 0; padding: 0; }@font-face { font-family:'Everyday Sans Web'; src:url('https://ymsdashboarddc6056.github.io/EverydaySans-Regular-Web.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:swap; }@font-face { font-family:'Everyday Sans Web'; src:url('https://ymsdashboarddc6056.github.io/EverydaySans-Medium-Web.woff2') format('woff2'); font-weight:500; font-style:normal; font-display:swap; }@font-face { font-family:'Everyday Sans Web'; src:url('https://ymsdashboarddc6056.github.io/EverydaySans-Bold-Web.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:swap; }body { background: #0d1b2a; color: #f9fafb; font-family: 'Everyday Sans Web', 'Segoe UI', system-ui, Arial, sans-serif;       height: 100vh; display: flex; flex-direction: column; overflow: hidden; }header { background: #0053E2; padding: 8px 16px; display: flex;         justify-content: space-between; align-items: center; flex-shrink: 0; gap: 10px; }h1 { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }#logo { height: 34px; width: auto; display: block; }#clock { font-size: .95rem; font-weight: 600; }.stats { display: flex; background: #111827;         border-bottom: 2px solid #1f2937; flex-shrink: 0; }.stat { flex: 1; text-align: center; padding: 6px 4px;        border-right: 1px solid #1f2937; }.stat:last-child { border-right: none; }.val { font-size: 1.6rem; font-weight: 800; color: #60a5fa; line-height: 1; }.lbl { font-size: .6rem; color: #9ca3af; text-transform: uppercase; margin-top: 2px; }#grid { flex: 1; overflow-y: auto; scroll-behavior: smooth; display: grid;        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));        gap: 10px; padding: 12px; align-content: start; }.door { border-radius: 12px; padding: 14px 16px;        display: flex; flex-direction: column; gap: 5px; }.dnum { font-size: 1.9rem; color: rgba(255,255,255,.7); font-weight: 700; }.trailer { font-size: 1.7rem; font-weight: 900; font-family: monospace;           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }.dir { font-size: 1.7rem; font-weight: 800; opacity: .9; }.state { font-size: 1rem; font-weight: 800; opacity: .95; }@keyframes pulse-move {  0%,100% { box-shadow:0 0 0 8px #ff0000, 0 0 0 14px rgba(255,0,0,.35), 0 0 40px 10px rgba(255,0,0,.6); filter:brightness(1.08); }  50%     { box-shadow:0 0 0 3px rgba(255,0,0,.25), 0 0 10px 2px rgba(255,0,0,.1); filter:brightness(1); }}.move-active { animation: pulse-move 2s ease-in-out infinite; }#stale { display:none; position:absolute; inset:0; z-index:99;         background:#111827; flex-direction:column;         align-items:center; justify-content:center; gap:24px; }#stale-icon { font-size:5rem; }#stale-msg  { font-size:2.8rem; font-weight:900; color:#f9fafb;              text-align:center; line-height:1.2; }#stale-sub  { font-size:1.2rem; color:#9ca3af; text-align:center; }#footer { text-align: center; padding: 3px; font-size: .6rem;          color: #374151; flex-shrink: 0; }#reminders { text-align:center; padding:8px 16px; font-size:1.1rem;             font-weight:700; color:#fbbf24; background:#1c1f26;             border-top:2px solid #374151; flex-shrink:0; letter-spacing:.03em; }.stack-badge { display:inline-block; margin-left:6px;               font-size:.8rem; font-weight:900; opacity:.9; }</style></head><body><header>  <h1 id="title"><img id="logo" src="https://ymsdashboarddc6056.github.io/dc6056-badge-logo.png" alt="" onerror="this.remove()"><span id="title-text">YMS — DC 6056</span></h1>  <div id="clock"><span style="color:#34d399">LIVE</span></div></header><div id="stale">  <div id="stale-icon">&#128203;</div>  <div id="stale-msg">Check with the desk<br>for trailer status</div>  <div id="stale-sub">Live data unavailable &#8212; system may be offline</div></div><div class="stats">  <div class="stat"><div class="val" id="s-total">--</div>    <div class="lbl" id="lbl-total">Total</div></div>  <div class="stat"><div class="val" id="s-ship">--</div>    <div class="lbl" id="lbl-ship">Shipping</div></div>  <div class="stat"><div class="val" id="s-recv">--</div>    <div class="lbl" id="lbl-recv">Receiving</div></div>  <div class="stat"><div class="val" id="s-dock">--</div>    <div class="lbl" id="lbl-dock">Docked</div></div></div><div id="grid"></div><div id="reminders"></div><div id="footer">Connecting...</div><script>var TV_NAME  = new URLSearchParams(location.search).get("tv") || "onn-relay";var WORKER_URL = "https://yms-relay.ymsdashboarddc6056.workers.dev/data.json";var MIRROR_URL = "https://ymsdashboarddc6056.github.io/yms-mirror/data.json";var workerOk    = false;var usingMirror = false;var pollTimer   = null;var kioskVer    = null;function esc(s) {  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")                      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");}var _lang = 'en';var _TRANSLATIONS = {  'Total':              'Total',  'Shipping':           'Embarque',  'Receiving':          'Recibo',  'Docked':             'Acoplado',  'AVAILABLE':          'DISPONIBLE',  'MOVE PLANNED OUT':   'SALIDA PLANEADA',  'MOVE PLANNED IN':    'ENTRADA PLANEADA',  'TRAILER CLOSED':     'TRAILER CERRADO',  'Ready':              'Listo',  'Connecting...':      'Conectando...',  'Reconnecting...':    'Reconectando...',  'Zone':               'Zona'};function t(s) { return _lang==='es' ? (_TRANSLATIONS[s] || s) : s; }function _applyStaticLabels() {  document.getElementById("lbl-total").textContent = t("Total");  document.getElementById("lbl-ship").textContent  = t("Shipping");  document.getElementById("lbl-recv").textContent  = t("Receiving");  document.getElementById("lbl-dock").textContent  = t("Docked");  document.getElementById("stale-msg").innerHTML =    _lang==='es' ? 'Consulte con el escritorio<br>para el estado del trailer'                 : 'Check with the desk<br>for trailer status';  document.getElementById("stale-sub").textContent =    _lang==='es' ? 'Datos en vivo no disponibles — el sistema puede estar fuera de linea'                 : 'Live data unavailable — system may be offline';}var _lastRenderedData = null;setInterval(function() {  _lang = _lang==='en' ? 'es' : 'en';  _applyStaticLabels();  _cycleReminder();  if (_lastRenderedData) { render(_lastRenderedData); }}, 10000);function setStatus(color, label) {  document.getElementById("clock").innerHTML =    new Date().toLocaleTimeString()    + " <span style=\"background:" + color + ";padding:2px 8px;"    + "border-radius:4px;font-size:.75rem\">" + label + "</span>";}function showStale(msg) {  var el = document.getElementById("stale");  document.getElementById("stale-sub").textContent = msg;  el.style.display = "flex";}function hideStale() {  document.getElementById("stale").style.display = "none";}var FAIL_THRESHOLD = 3;function _updateStaleState() {  if (_consecutiveFetchFails >= FAIL_THRESHOLD && !usingMirror) {    showStale(_lang==='es' ? 'No se puede conectar al servidor — la red puede estar caida'                          : 'Cannot reach server — network may be down');    return;  }  if (_relayAliveTs) {    var age = Math.round(Date.now()/1000 - _relayAliveTs);    if (age > 180) {      showStale(_lang==='es' ? ('Los datos tienen ' + age + 's de antiguedad — el relay puede estar fuera de linea')                            : ('Data is ' + age + 's old — relay may be offline'));      return;    }  }  hideStale();}function render(d) {  _lastRenderedData = d;  setAge(d.last_change_ts);  localStorage.removeItem("yms_server_url");  if (d.kiosk_ver) {    if (kioskVer === null) { kioskVer = d.kiosk_ver; }    else if (kioskVer !== d.kiosk_ver) {      location.replace("?tv=" + TV_NAME + "&kv=" + d.kiosk_ver); return;    }  }  var zone  = (d.tv_assignments||{})[TV_NAME] || "All";  var zd    = d.zone_doors || {};  var doors = zone==="All"    ? Object.keys(zd).reduce(function(a,k){return a.concat(zd[k]);}, [])    : (zd[zone]||[]);  var sum = d.summary||{};  if (zone==="All") {    document.getElementById("s-total").textContent = sum.total    ||"--";    document.getElementById("s-ship").textContent  = sum.shipping ||"--";    document.getElementById("s-recv").textContent  = sum.receiving||"--";    document.getElementById("s-dock").textContent  = sum.docked   ||"--";  } else {    document.getElementById("s-total").textContent = doors.filter(function(x){return !x.empty;}).length;    document.getElementById("s-ship").textContent  = doors.filter(function(x){return x.dir==="SHIP";}).length;    document.getElementById("s-recv").textContent  = doors.filter(function(x){return x.dir==="RECV";}).length;    document.getElementById("s-dock").textContent  = doors.filter(function(x){return x.lbl==="DOCKED";}).length;  }  document.getElementById("title-text").textContent = "YMS — " + zone;  var html = "";  for (var i=0; i<doors.length; i++) {    var door = doors[i];    var borderStyle = door.empty      ? "border:3px dashed #4b5563;background:#1f2937;"      : "background:"+esc(door.bg)+";" ;    var isMove = !door.empty && (door.lbl==="MOVE PLANNED IN" || door.lbl==="MOVE PLANNED OUT");    var stackBadge = (!door.empty && door.stacked)      ? "<div class=\"stack-badge\">≡ 2</div>"      : "";    html += "<div class=\"door"+(isMove?" move-active":"")+"\" style=\""+borderStyle+"\">"      + "<div class=\"dnum\" style=\"color:"+(door.empty?"#6b7280":"inherit")+"\">"+esc(door.num)+"</div>"      + "<div class=\"trailer\" style=\"color:"+(door.empty?"#4b5563":"inherit")+"\">"+( esc(door.t)||"&mdash;")+"</div>"      + "<div class=\"dir\">"+esc(door.st)+"</div>"      + "<div class=\"state\" style=\"color:"+(door.empty?"#6b7280":"inherit")+"\">"+esc(t(door.lbl))+stackBadge+"</div>"      + "</div>";  }  var _gridEl = document.getElementById("grid");  var _prevScroll = _gridEl.scrollTop;  _gridEl.innerHTML = html;  _gridEl.scrollTop = _prevScroll;  document.getElementById("footer").textContent =    t("Zone")+": "+zone+" • "+d.updated+" • "+TV_NAME;}var _lastDataTs = 0;var _consecutiveFetchFails = 0;function _tryMirror() {  fetch(MIRROR_URL, {cache:"no-store"})  .then(function(r){ return r.json(); })  .then(function(d) {    usingMirror = true;    if (d.relay_alive_ts) { _relayAliveTs = d.relay_alive_ts; }    if (d.last_change_ts && d.last_change_ts > _lastDataTs) {      _lastDataTs = d.last_change_ts;      render(d);    }    document.getElementById("footer").textContent =      (_lang==='es' ? 'Fuente de respaldo (reflejando) — ' : 'Backup feed (mirror) — ') + TV_NAME;    _updateStaleState();  })  .catch(function() { usingMirror = false; });}function pollData() {  fetch(WORKER_URL, {cache:"no-store"})  .then(function(r){ return r.json(); })  .then(function(d) {    workerOk = true;    usingMirror = false;    _consecutiveFetchFails = 0;    if (d.relay_alive_ts) { _relayAliveTs = d.relay_alive_ts; }    if (d.last_change_ts && d.last_change_ts > _lastDataTs) {      _lastDataTs = d.last_change_ts;      render(d);    }    _updateStaleState();  })  .catch(function(e){ workerOk=false;    _consecutiveFetchFails++;    if (_consecutiveFetchFails >= FAIL_THRESHOLD) { _tryMirror(); }    var age = _lastDataTs ? Math.round(Date.now()/1000 - _lastDataTs) : null;    var msg = age && age > 120      ? (_lang==='es' ? ('SIN DATOS ' + age + 's — llame a Sistemas') : ('NO DATA ' + age + 's — call IT'))      : t('Reconnecting...');    document.getElementById("footer").textContent = msg;    _updateStaleState();  })  .finally(function() { pollTimer = setTimeout(pollData, 5000); });}fetch(WORKER_URL, {cache:"no-store"}).then(function(r){ return r.json(); }).then(function(d) { workerOk = true; _consecutiveFetchFails = 0; _lastDataTs = d.last_change_ts || 0; _relayAliveTs = d.relay_alive_ts || 0; render(d); }).catch(function(e){ _consecutiveFetchFails++; document.getElementById("footer").textContent="Boot err: "+e; _updateStaleState(); }).finally(function() { pollTimer = setTimeout(pollData, 5000); });function setAge(ts) { _lastDataTs = ts || _lastDataTs; }var _relayAliveTs = 0;setInterval(_updateStaleState, 10000);var _reminders_en = [  "⚠️  Remember to Secure Your Load and Take Photo",  "🌡️  Remember to Set Temps",  "🚪  Remember to Seal Bulkheads",  "🚦  Do you have a Red Light or Green Light?"];var _reminders_es = [  "⚠️  Recuerde Asegurar su Carga y Tomar Foto",  "🌡️  Recuerde Configurar las Temperaturas",  "🚪  Recuerde Sellar los Mamparos",  "🚦  Tiene Luz Roja o Luz Verde?"];var _rIdx = 0;function _cycleReminder() {  var list = _lang==='es' ? _reminders_es : _reminders_en;  document.getElementById("reminders").textContent = list[_rIdx % list.length];  _rIdx = (_rIdx + 1) % list.length;}_cycleReminder();setInterval(_cycleReminder, 5000);var _scrollDir = 1;setInterval(function() {  var grid = document.getElementById("grid");  var maxScroll = grid.scrollHeight - grid.clientHeight;  if (maxScroll <= 4) return;  if (_scrollDir > 0) { grid.scrollTop = maxScroll; _scrollDir = -1; }  else { grid.scrollTop = 0; _scrollDir = 1; }}, 8000);setInterval(function() {  var _now = new Date();  var mode = workerOk ? ("<span style=\"color:#60a5fa\">" + (_lang==='es' ? 'EN VIVO' : 'LIVE') + "</span>")           : usingMirror ? "<span style=\"color:#fb923c\">MIRROR</span>"           : "<span style=\"color:#f87171\">ERR</span>";  var age  = _relayAliveTs ? Math.round(Date.now()/1000 - _relayAliveTs) : null;  var ageStr = age===null ? "?" : (age<3 ? "live" : age+"s ago");  document.getElementById("clock").innerHTML = _now.toLocaleTimeString()+" "+mode+" "+ageStr;}, 1000);</script></body></html>
